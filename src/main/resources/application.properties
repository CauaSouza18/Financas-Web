spring.application.name=financas

# Nao expoe mensagens internas de excecoes nas respostas de erro.
server.error.include-message=never
server.error.include-binding-errors=never

# Banco de dados (pool HikariCP gerenciado pelo Spring).
# Configure em producao via variaveis de ambiente: DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/app_financas}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Sessao: timeout, cookie HttpOnly e SameSite=strict (mitiga CSRF).
# Ao servir via HTTPS, ative tambem: server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false

# Health check para orquestradores/Docker.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.base-url=${APP_BASE_URL:http://localhost:8080}
